<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anastasia Vodchits</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrapper">
    <header class="flex-container">
      <div class="languages flex-container">
        <div id="en" class="language active">en</div>
        <div id="ru" class="language">es</div>
        <div id="es" class="language">ru</div>
      </div>
      <div class="settings flex-container">
        <div class="download flex-container">
          <p>Download PDF</p>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M7.5 11L12 15.5L16.5 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M4 19H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </div>
        <div class="theme-btn-container flex-container">
          <div class="theme-btn active" id="light-mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5" />
              <path
                d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </div>
          <div class="theme-btn" id="dark-mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20 15.5C18.9 16 17.7 16.3 16.5 16.3C11.6 16.3 7.7 12.4 7.7 7.5C7.7 6.3 8 5.1 8.5 4C5.3 5.4 3 8.6 3 12.3C3 17.1 6.9 21 11.7 21C15.4 21 18.6 18.7 20 15.5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>

    </header>
    <main>

    </main>
  </div>
</body>

</html>
